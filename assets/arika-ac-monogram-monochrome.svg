<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Pure Monochrome Vector Monogram (Black on White / Invertible to White on Black) -->
  <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- C Underlay -->
    <path 
      d="M 365 160 
         C 330 115, 235 110, 175 160 
         C 110 215, 110 295, 170 348 
         C 230 395, 335 390, 368 340" 
      fill="none" 
      stroke-width="26" 
    />

    <!-- A Left Stem With Negative Space Gap Cutout -->
    <path d="M 250 105 L 148 395" fill="none" stroke="transparent" stroke-width="36" />
    <path d="M 250 105 L 148 395" fill="none" stroke-width="26" />

    <!-- A Crossbar -->
    <path d="M 192 285 L 308 285" fill="none" stroke-width="22" />

    <!-- A Right Stem -->
    <path d="M 250 105 L 352 395" fill="none" stroke-width="26" />

    <!-- C Top Interlock Segment -->
    <path 
      d="M 295 125 C 335 138, 365 160, 365 160" 
      fill="none" 
      stroke-width="26" 
    />
    
    <!-- Top Apex & Diamond Accent -->
    <circle cx="250" cy="105" r="13" fill="currentColor" stroke="none" />
    <path d="M 250 56 L 254 66 L 264 70 L 254 74 L 250 84 L 246 74 L 236 70 L 246 66 Z" fill="currentColor" stroke="none" />
  </g>
</svg>
